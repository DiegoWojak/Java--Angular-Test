<div class="login-wrapper">
  <p-card header="Inventario" subheader="Inicia sesión para continuar" styleClass="login-card">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text" pInputText formControlName="username" autocomplete="username" />
        <app-field-error [control]="form.controls.username" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <p-password inputId="password" formControlName="password" [feedback]="false" [toggleMask]="true"
                    styleClass="w-full" inputStyleClass="w-full" autocomplete="current-password" />
        <app-field-error [control]="form.controls.password" />
      </div>

      <p-button type="submit" label="Ingresar" icon="pi pi-sign-in" [loading]="loading" styleClass="w-full" />
    </form>
  </p-card>
</div>
