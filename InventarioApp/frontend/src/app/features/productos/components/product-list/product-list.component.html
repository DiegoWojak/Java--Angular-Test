<div class="page">
  <p-toolbar styleClass="mb-3">
    <div class="p-toolbar-group-start">
      <h2 class="title">Productos</h2>
    </div>
    <div class="p-toolbar-group-end toolbar-end">
      <p-iconField iconPosition="left">
        <p-inputIcon styleClass="pi pi-search" />
        <input type="text" pInputText [formControl]="busqueda" placeholder="Buscar por nombre..." aria-label="Buscar por nombre" />
      </p-iconField>
      <p-button label="Nuevo" icon="pi pi-plus" (onClick)="nuevo()" />
    </div>
  </p-toolbar>


<p-table [value]="productos" [loading]="loading" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]"
           dataKey="id" [tableStyle]="{ 'min-width': '50rem' }" styleClass="p-datatable-striped">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre" /></th>
        <th>Descripción</th>
        <th pSortableColumn="cantidad" class="num">Cantidad <p-sortIcon field="cantidad" /></th>
        <th pSortableColumn="precio" class="num">Precio <p-sortIcon field="precio" /></th>
        <th class="acciones">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-p>
      <tr>
        <td>{{ p.nombre }}</td>
        <td>{{ p.descripcion || '—' }}</td>
        <td class="num">{{ p.cantidad }}</td>
        <td class="num">{{ p.precio | currency: 'PEN' : 'S/ ' }}</td>
        <td class="acciones">
          <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" pTooltip="Editar" (onClick)="editar(p)"
                    [attr.aria-label]="'Editar ' + p.nombre" />
          <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" pTooltip="Eliminar"
                    (onClick)="confirmarEliminar(p)" [attr.aria-label]="'Eliminar ' + p.nombre" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty">No se encontraro productos almacenados.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="dialogVisible" [header]="productoSeleccionado ? 'Editar producto' : 'Nuevo producto'"
          [modal]="true" [style]="{ width: '34rem' }" [breakpoints]="{ '575px': '95vw' }" [draggable]="false">
  @if (dialogVisible) {
    <app-producto-form [producto]="productoSeleccionado" (guardado)="onGuardado()" (cancelado)="dialogVisible = false" />
  }
</p-dialog>
