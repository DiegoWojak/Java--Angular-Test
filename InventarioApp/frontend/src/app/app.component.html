@if (auth.username(); as username) {
    <header class="topbar">
        <span class="brand"><i class="pi pi-box"></i> Inventario</span>
        <span class="user">
            <i class="pi pi-user"></i> {{ username }}
            <p-button label="Salir" icon="pi pi-sign-out" [text]="true" size="small" (onClick)="auth.logout()"/>
        </span>
    </header>
}

<p-toast position="top-right" />
<p-confirmDialog />
<router-outlet />
